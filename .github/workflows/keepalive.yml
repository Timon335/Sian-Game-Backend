# เรียก API วันละครั้ง เพื่อไม่ให้ฐานข้อมูล Supabase แบบฟรีถูกหยุดเพราะไม่มีการใช้งาน
name: keepalive

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 30 --max-time 120 -o /dev/null https://sian-game-api.onrender.com/api/games
